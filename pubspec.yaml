name: feiniu_tv_music
description: XX音乐 —— 飞牛 fnOS NAS 专用 Android TV 客厅音乐播放器
publish_to: 'none'
version: 0.2.0+2

environment:
  # 目标运行环境：用户本机现代 Flutter（Flutter >= 3.10 / Dart >= 3.0 即可）。
  # 沙箱内置 Flutter 3.0.0 / Dart 2.17.0 低于本下限，且无法访问 pub.dev，故沙箱内无法构建；
  # 编译/构建请在具备完整工具链与网络的机器上进行。
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP 客户端
  dio: ^5.4.3+1

  # 系统解码播放引擎（ExoPlayer / AVPlayer）
  just_audio: ^0.9.38

  # 后台播放 + Android MediaSession + 遥控媒体键
  audio_service: ^0.18.15
  audio_session: ^0.1.19

  # 敏感凭据安全存储（Android Keystore / iOS Keychain）
  flutter_secure_storage: ^9.0.0

  # sha256 密码哈希（登录使用）
  crypto: ^3.0.3

  # 轻量依赖注入 / 状态（不引入重型框架，见 technical_research.md 决策 D2）
  provider: ^6.1.2

  # 汉字 → 拼音（拼音模糊搜索）
  #
  # ⚠️ 选型必须锁在 3.x：`lpinyin` 2.0.3 的 SDK 约束是
  #    `>=2.12.0-259.9.beta <3.0.0`，**不含 Dart 3**，pub 解析会直接失败
  #    （pub.dev 页面上显示的 "Dart 3 compatible" 是误导）。
  #    `pinyin` 3.3.0 的约束是 `>=2.12.0 <4.0.0`，纯 Dart、零依赖、BSD-2，
  #    且内置字表 + 词组表，正是"多音字按词组判定"所需。
  pinyin: ^3.3.0

  # 二维码编码（手机遥控配对）。
  #
  # ⚠️ 曾经项目里自写了一份「固定版本 4-L、单块、掩码 0」的编码器，
  #    结果有两处独立错误（功能区域未预留 + 格式信息位坐标转置），
  #    二维码必然扫不出来，而且当时的测试是「自己生成的矩阵跟自己比」，
  #    把错误布局自证成了「通过」。
  #    现在改用成熟库：纯 Dart、无原生依赖、**离线可用**（不涉及 CDN）。
  #    SDK 约束 `^3.11.0`，CI 的 Dart 3.13.5 满足。
  qr: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true
