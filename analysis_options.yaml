# 官方 Flutter 模板的入口是 package:flutter_lints/flutter.yaml；
# 原先写的 flutter_lints/flutter_lints.yaml 不存在，会导致 include_file_not_found
# 且整套 flutter_lints 规则失效（等于静默降低了分析标准）。
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # 可读性优先于样板
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    # TV 项目里我们大量手动控制 Focus，关闭过度严格的警告
    avoid_redundant_argument_values: false
