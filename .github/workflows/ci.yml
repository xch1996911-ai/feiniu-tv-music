name: Phase1 CI

# Phase 1 验证流水线（不进入 Phase 2）
#
# 目标：
#   1) 质量门：flutter pub get -> analyze -> test，任一步失败即 FAILED
#   2) 诊断产物：6 个「渲染后端 × 插件注册」诊断 APK
#      （海信 E7N Pro / VIDDA：Flutter 第一帧之前就失败，需要分离变量定位）
#   3) Windows 独立 EXE：fnos_api_probe.exe（目标机无需 Flutter/Dart/Git/Node）
#
# 约束：
#   - Flutter 版本固定 3.47.6，不使用会漂移的 latest
#   - 不允许忽略 analyze / test 的失败，不使用 continue-on-error
#   - 6 个诊断 APK 来自**同一 commit、同一份 Dart 业务代码**，
#     只允许构建配置（Renderer / 插件注册 / 构建类型）不同
#   - 本 workflow **不写 release 分支**：那由 publish-diag.yml 独占，见文件末尾说明

on:
  push:
    branches: ['main']
    # ci-logs/ 由本 workflow 自己提交，若不过滤会无限自我触发
    paths-ignore:
      - 'ci-logs/**'
  workflow_dispatch:

jobs:
  android:
    name: 质量门 + 6 个诊断 APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # 必需：用于把诊断日志提交回仓库（否则 GITHUB_TOKEN 只读，git push 会失败）
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.47.6 (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          set -o pipefail
          {
            echo "=== flutter ==="; flutter --version
            echo "=== java ===";    java -version
            echo "=== python ===";  python3 --version
            echo "=== gradle wrapper ==="; cat android/gradle/wrapper/gradle-wrapper.properties
          } 2>&1 | tee build.log

      # Flutter 3.47.6 要求 compileSdk 36。runner 镜像不一定把 sdkmanager 放进 PATH，
      # 故按完整路径 → PATH → 放弃三段式探测；即使装不上，AGP 也会自动下载
      # （GitHub runner 已预接受 licenses），因此这里不阻断流水线。
      - name: Install Android SDK 36
        run: |
          set -o pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            echo "使用 sdkmanager: $SDKMANAGER" | tee -a build.log
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tee -a build.log || true
          else
            echo "::notice::未找到 sdkmanager，跳过显式安装；依赖 AGP 自动下载 SDK 组件" | tee -a build.log
          fi

      - name: flutter pub get
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a build.log

      # ── 质量门：以下两步失败即整体 FAILED，不允许跳过、不允许降级 ──────────

      - name: flutter analyze  (失败即终止，不允许跳过)
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee -a analyze.log

      - name: flutter test  (失败即终止，不允许跳过)
        run: |
          set -o pipefail
          flutter test 2>&1 | tee -a test.log

      # ── 诊断 APK：6 个变体，只差构建配置 ────────────────────────────────

      - name: 打印诊断变体矩阵
        run: |
          set -o pipefail
          python3 tools/diag/make_variant.py --list 2>&1 | tee diag-matrix.log

      - name: 构建 6 个诊断 APK（Renderer × 插件注册）
        run: |
          set -o pipefail
          mkdir -p dist
          python3 tools/diag/make_variant.py --list 2>&1 | tee -a diag-matrix.log

          for V in A B C D E F; do
            echo "" | tee -a build.log
            echo "==================== 变体 $V ====================" | tee -a build.log

            # 应用该变体的构建配置（只改 AndroidManifest.xml 与 build.gradle.kts）
            eval "$(python3 tools/diag/make_variant.py "$V" --emit shell)"
            python3 tools/diag/make_variant.py "$V" 2>&1 | tee -a diag-matrix.log

            # 只打包 ARM：Android TV 都是 ARM，x86_64 只服务模拟器。
            # 6 个变体一致使用该设置，因此不会成为混淆变量。
            if [ "$BUILD_TYPE" = "release" ]; then
              flutter build apk --release --target-platform "$PLATFORMS" -t "$ENTRY" $DART_DEFINES 2>&1 | tee -a build.log
              OUT="build/app/outputs/flutter-apk/app-release.apk"
            else
              flutter build apk --debug --target-platform "$PLATFORMS" -t "$ENTRY" $DART_DEFINES 2>&1 | tee -a build.log
              OUT="build/app/outputs/flutter-apk/app-debug.apk"
            fi

            if [ ! -f "$OUT" ]; then
              echo "!! 变体 $V 未生成 APK：$OUT"
              ls -R build/app/outputs 2>/dev/null || true
              exit 1
            fi

            cp "$OUT" "dist/$ARTIFACT"
            stat -c '%n = %s bytes' "dist/$ARTIFACT" | tee -a build.log

            # 还原构建配置，保证下一个变体从同一份基线出发
            python3 tools/diag/make_variant.py --revert 2>&1 | tee -a diag-matrix.log
          done

      - name: 校验 6 个产物并生成 MANIFEST.txt
        run: |
          set -o pipefail
          python3 tools/diag/make_variant.py --write-manifest dist 2>&1 | tee -a diag-matrix.log
          ls -la dist | tee -a build.log

      - name: 确认构建配置已还原干净
        run: |
          set -o pipefail
          # 诊断脚本只可能改这两个文件，因此只校验这两个文件。
          #
          # 曾经这里校验整个仓库（`git status --porcelain --untracked-files=no`），
          # 结果被 `flutter pub get` 误伤：Flutter 3.47 会**自动改写被跟踪的
          # analysis_options.yaml**（日志里的 "Upgrading analysis_options.yaml to
          # exclude build and platform directories"），于是这一整轮构建成功、
          # 6 个 APK 也构建出来了，却因为这个误报而让 job 失败、
          # 后续的 artifact 上传步骤全部被跳过 —— 产物直接丢失。
          # 教训：校验范围要精确到「自己改动的文件」，别用全仓库状态当代理指标。
          git checkout -- android/ analysis_options.yaml

          echo "=== 诊断脚本涉及的两个文件 · git diff --stat ===" | tee -a diag-matrix.log
          git diff --stat -- android/app/src/main/AndroidManifest.xml android/app/build.gradle.kts | tee -a diag-matrix.log
          echo "=== 诊断脚本涉及的两个文件 · git status --porcelain ===" | tee -a diag-matrix.log
          git status --porcelain --untracked-files=no -- \
            android/app/src/main/AndroidManifest.xml \
            android/app/build.gradle.kts | tee -a diag-matrix.log

          if git status --porcelain --untracked-files=no -- \
               android/app/src/main/AndroidManifest.xml \
               android/app/build.gradle.kts | grep -q .; then
            echo "!! 诊断构建的临时改动没有还原干净（AndroidManifest.xml / build.gradle.kts）"
            exit 1
          fi
          echo "OK：AndroidManifest.xml 与 build.gradle.kts 均已还原到检出状态"

      # 日志脱敏：CI 本身不接触 NAS 凭据，这里做二次兜底。
      # IP 规则只匹配私有/回环网段，避免把 "17.0.20.1"、"3.13.5" 这类版本号误判成 IP。
      - name: 日志脱敏
        if: always()
        run: |
          set -o pipefail
          for f in build.log analyze.log test.log diag-matrix.log; do
            [ -f "$f" ] || continue
            sed -E -i 's/((token|password|passwd|pwd|cookie|authorization|authx|fnid)[[:space:]]*[:=][[:space:]]*)[^[:space:],;]+/\1<REDACTED>/gI' "$f"
            sed -E -i 's/\b(10\.|127\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)[0-9]{1,3}\.[0-9]{1,3}\b/<IP-REDACTED>/g' "$f"
          done
          echo "脱敏完成"

      # ── 6 个 APK 各自上传为独立 artifact，便于在电视上逐个安装验证 ────────
      #
      # ⚠️ 这些步骤（以及日志脱敏）全部带 `if: always()`：产物是这轮实验唯一的交付物，
      #    绝不能让它的存续依赖后面某个校验步骤是否通过。真实事故：6 个 APK 全部构建
      #    成功，却因紧随其后的「还原检查」误报失败，导致上传步骤整批被跳过、产物丢失。

      - name: 上传 A · no-impeller debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-hisense-no-impeller-debug.apk
          path: dist/app-hisense-no-impeller-debug.apk
          if-no-files-found: error
          retention-days: 5

      - name: 上传 B · impeller 默认 debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-hisense-impeller-default-debug.apk
          path: dist/app-hisense-impeller-default-debug.apk
          if-no-files-found: error
          retention-days: 5

      - name: 上传 C · impeller GLES debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-hisense-impeller-gles-debug.apk
          path: dist/app-hisense-impeller-gles-debug.apk
          if-no-files-found: error
          retention-days: 5

      - name: 上传 D · no-impeller release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-hisense-no-impeller-release.apk
          path: dist/app-hisense-no-impeller-release.apk
          if-no-files-found: error
          retention-days: 5

      - name: 上传 E · engine smoke（含插件注册）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-hisense-engine-smoke.apk
          path: dist/app-hisense-engine-smoke.apk
          if-no-files-found: error
          retention-days: 5

      - name: 上传 F · engine smoke（不注册插件）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-hisense-engine-smoke-no-plugins.apk
          path: dist/app-hisense-engine-smoke-no-plugins.apk
          if-no-files-found: error
          retention-days: 5

      - name: 上传构建日志与产物清单（已脱敏）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            build.log
            analyze.log
            test.log
            diag-matrix.log
            dist/MANIFEST.txt
          if-no-files-found: warn
          retention-days: 5

      # 把日志提交到仓库的 ci-logs/ 目录：本地 git fetch 即可读取，
      # 无需下载 artifact（artifact 与 job 日志下载均需鉴权，公开仓库亦然）。
      - name: 提交诊断日志（ci-logs/）
        if: always()
        run: |
          set -o pipefail
          mkdir -p ci-logs
          for f in build.log analyze.log test.log diag-matrix.log; do
            [ -f "$f" ] && cp "$f" ci-logs/ || true
          done
          [ -f dist/MANIFEST.txt ] && cp dist/MANIFEST.txt ci-logs/MANIFEST.txt || true
          printf 'run_id: %s\nsha: %s\ntime: %s\n' \
            "${{ github.run_id }}" "${{ github.sha }}" "$(date -u +%FT%TZ)" > ci-logs/meta.txt
          # .gitignore 里有 *.log，需 -f 强制添加；该路径已配 paths-ignore，不会再触发本 workflow
          git add -f ci-logs
          git -c user.name='github-actions[bot]' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit -q -m "ci: diagnostics for run ${{ github.run_id }}" || echo "无日志可提交"
          git push origin HEAD:main

  probe-exe:
    name: fnOS API Probe (Windows EXE)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart (pinned, 与 Flutter 3.47.6 自带一致)
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'

      - name: dart pub get
        working-directory: tools/fnos_api_probe
        run: dart pub get

      - name: dart analyze  (失败即终止)
        working-directory: tools/fnos_api_probe
        run: dart analyze --fatal-infos

      - name: dart compile exe  (自包含 EXE)
        working-directory: tools/fnos_api_probe
        run: dart compile exe bin/probe.dart -o fnos_api_probe.exe

      - name: 校验 EXE 产物
        working-directory: tools/fnos_api_probe
        run: |
          if (-not (Test-Path fnos_api_probe.exe)) { throw "未生成 fnos_api_probe.exe" }
          Get-Item fnos_api_probe.exe | Format-List Name,Length,LastWriteTime

      - name: 上传 fnos_api_probe.exe
        uses: actions/upload-artifact@v4
        with:
          name: fnos_api_probe.exe
          path: tools/fnos_api_probe/fnos_api_probe.exe
          if-no-files-found: error
          retention-days: 5

  # ⚠️ 这里**刻意没有**「把产物推到 release 分支」的 job。
  #
  # 曾经有一个 `release-bundle` job：只把 D（release APK）+ probe EXE 推到 release
  # 分支。它有两个问题，已经删掉：
  #   1) 它用孤儿分支 force push，会**整批覆盖** release 分支 ——
  #      也就是会把 publish-diag 放上去的 5 个 debug 包全部抹掉，
  #      用户手里的下载网址会在下一次 CI 之后集体失效；
  #   2) 它写死 `dl-logs/MANIFEST.txt`，而 upload-artifact 保存的是
  #      `dist/MANIFEST.txt` → 路径对不上，清单被静默跳过。
  #
  # 现在 release 分支由 `.github/workflows/publish-diag.yml` **独占**：
  # 它把 6 个 APK + probe EXE + MANIFEST 一次性放上去，
  # 单一写入者因此不存在互相 force push 的竞态。
  # 触发方式：`git push --force origin main:publish-diag`（等本轮 CI 成功之后再推）。
